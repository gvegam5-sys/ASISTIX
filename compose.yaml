services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: asistix
      POSTGRES_USER: asistix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistix -d asistix"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://asistix:${POSTGRES_PASSWORD}@db:5432/asistix
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      DEMO_MODE: ${DEMO_MODE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      ABSENTEEISM_MIN_SESSIONS: ${ABSENTEEISM_MIN_SESSIONS:-3}
      ABSENTEEISM_HIGH_BELOW: ${ABSENTEEISM_HIGH_BELOW:-70}
      ABSENTEEISM_MEDIUM_BELOW: ${ABSENTEEISM_MEDIUM_BELOW:-80}
      ABSENTEEISM_HIGH_STREAK: ${ABSENTEEISM_HIGH_STREAK:-3}
      ABSENTEEISM_MEDIUM_STREAK: ${ABSENTEEISM_MEDIUM_STREAK:-2}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 15
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
